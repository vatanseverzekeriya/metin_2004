# Metin2 PvP Server Configuration
# =================================

[SERVER]
# Sunucu temel ayarları
SERVER_NAME = Metin2 PvP Server
PORT = 13000
MAX_PLAYERS = 1000
CHANNEL_COUNT = 4

# FPS ayarları
SERVER_FPS = 25
IDLE_FPS = 5

# Log ayarları
LOG_LEVEL = INFO
LOG_DIR = ./log/

[DATABASE]
# MySQL/MariaDB ayarları
DB_HOST = localhost
DB_PORT = 3306
DB_USER = metin2
DB_PASSWORD = metin2pass
DB_NAME = metin2

# Bağlantı havuzu
DB_POOL_SIZE = 10
DB_TIMEOUT = 30

[GAME]
# Oyun mekanik ayarları
EXP_RATE = 10
GOLD_RATE = 10
DROP_RATE = 10

# PvP ayarları
PVP_ENABLED = true
PVP_PROTECTION_LEVEL = 0
PVP_EXP_PERCENT = 50

# Seviye limitleri
MAX_LEVEL = 99
START_LEVEL = 1
START_GOLD = 0
START_EXP = 0

# Pozisyon ayarları
START_MAP = 1
START_X = 957200
START_Y = 244900

[COMBAT]
# Savaş ayarları
BASE_ATTACK_SPEED = 1000
CRITICAL_CHANCE = 0.05
CRITICAL_MULTIPLIER = 2.0

# Hasar hesaplaması
DAMAGE_VARIANCE = 0.20
MIN_DAMAGE = 10

[QUEST]
# Quest sistemi
QUEST_DIR = ./quest/
QUEST_ENABLED = true

[ANTI_CHEAT]
# Hile önleme
SPEED_HACK_LIMIT = 200
ATTACK_SPEED_HACK_LIMIT = 500
POSITION_CHECK_ENABLED = true

[NETWORK]
# Ağ ayarları
MAX_PACKET_SIZE = 8192
SEND_BUFFER_SIZE = 16384
RECV_BUFFER_SIZE = 16384
TIMEOUT = 300
